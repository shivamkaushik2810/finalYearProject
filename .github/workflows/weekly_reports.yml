name: Weekly parent reports

on:
  schedule:
    - cron: "30 3 * * 1-3"      # Mon-Wed 03:30 UTC = 09:00 IST (extra days finish what the daily Gmail cap left)
  workflow_dispatch:             # lets you run it from the GitHub Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-job.txt

      - run: pip install -r requirements-job.txt

      - name: Write secrets file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          mkdir -p .streamlit
          printf 'SUPABASE_URL = "%s"\nSUPABASE_KEY = "%s"\nEMAIL_ADDRESS = "%s"\nEMAIL_PASSWORD = "%s"\n' \
            "$SUPABASE_URL" "$SUPABASE_KEY" "$EMAIL_ADDRESS" "$EMAIL_PASSWORD" > .streamlit/secrets.toml

      - run: python scripts/send_weekly_reports.py
