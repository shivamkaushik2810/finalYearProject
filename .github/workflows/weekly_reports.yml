name: Weekly parent reports

on:
  schedule:
    - cron: "30 3 * * 1-3"      # Mon-Wed 03:30 UTC = 09:00 IST (extra days finish what the daily Gmail cap left)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send ALL mail to this address only (test mode). Empty = real parents."
        required: false
        default: ""
      current_week:
        description: "Use the current week (needs test_email)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build reports but send nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate manual inputs
        env:
          IN_TEST_EMAIL: ${{ inputs.test_email }}
          IN_CURRENT_WEEK: ${{ inputs.current_week }}
        run: |
          if [ "$IN_CURRENT_WEEK" = "true" ] && [ -z "$IN_TEST_EMAIL" ]; then
            echo "::error title=Invalid inputs::current_week is ticked but test_email is empty. A partial week must never go to real parents. Either enter your own email in test_email, or untick current_week to send the last full week."
            exit 1
          fi
          if [ -n "$IN_TEST_EMAIL" ] && ! printf '%s' "$IN_TEST_EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "::error title=Invalid test_email::test_email does not look like an email address."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-job.txt

      - run: pip install -r requirements-job.txt

      - name: Write secrets file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          mkdir -p .streamlit
          {
            printf 'SUPABASE_URL = "%s"\n' "$SUPABASE_URL"
            printf 'SUPABASE_KEY = "%s"\n' "$SUPABASE_KEY"
            printf 'EMAIL_ADDRESS = "%s"\n' "$EMAIL_ADDRESS"
            printf 'EMAIL_PASSWORD = "%s"\n' "$EMAIL_PASSWORD"
            if [ -n "$SMTP_HOST" ]; then
              printf 'SMTP_HOST = "%s"\n' "$SMTP_HOST"
              printf 'SMTP_PORT = "%s"\n' "${SMTP_PORT:-587}"
              printf 'SMTP_USER = "%s"\n' "$SMTP_USER"
              printf 'SMTP_PASSWORD = "%s"\n' "$SMTP_PASSWORD"
              printf 'SMTP_FROM = "%s"\n' "$SMTP_FROM"
            fi
          } > .streamlit/secrets.toml
          chmod 600 .streamlit/secrets.toml

      - name: Show which mail provider will be used
        run: |
          python - << 'PY'
          import tomllib
          s = tomllib.load(open(".streamlit/secrets.toml", "rb"))
          host = s.get("SMTP_HOST")
          print("provider:", "relay" if host else "gmail (SMTP_* secrets missing)")
          print("host:", host or "smtp.gmail.com", "| port:", s.get("SMTP_PORT", "587"))
          print("SMTP_USER set:", bool(s.get("SMTP_USER")), "| SMTP_PASSWORD set:", bool(s.get("SMTP_PASSWORD")), "| SMTP_FROM set:", bool(s.get("SMTP_FROM")))
          PY

      - name: Check Supabase URL (no secrets printed)
        run: |
          python - << 'PY'
          import re, socket, time, tomllib
          s = tomllib.load(open(".streamlit/secrets.toml", "rb"))
          u = s.get("SUPABASE_URL", "")
          print("SUPABASE_URL empty:", not u)
          print("has leading/trailing whitespace:", u != u.strip())
          u = u.strip()
          ok = bool(re.fullmatch(r"https://[a-z0-9]{20}\.supabase\.co", u))
          print("matches https://<20-char-ref>.supabase.co:", ok)
          host = u.replace("https://", "").split("/")[0]
          print("ref (first4...last4):", (host[:4] + "..." + host.split(".")[0][-4:]) if host else "(none)")
          last = None
          for attempt in range(1, 7):
              try:
                  socket.getaddrinfo(host, 443)
                  print(f"DNS resolves: True (attempt {attempt})")
                  break
              except Exception as e:
                  last = e
                  print(f"DNS attempt {attempt}/6 failed: {e}")
                  time.sleep(10)
          else:
              print("DNS resolves: False after 6 attempts -", last)
              for ctl in ("github.com", "supabase.com", "api.supabase.com"):
                  try:
                      socket.getaddrinfo(ctl, 443)
                      print(f"control {ctl}: resolves")
                  except Exception as e:
                      print(f"control {ctl}: FAILS - {e}")
              try:
                  socket.getaddrinfo(host, 443, socket.AF_INET)
                  print("project host over IPv4 only: resolves")
              except Exception as e:
                  print(f"project host over IPv4 only: FAILS - {e}")
              try:
                  ns = [l.split()[1] for l in open('/etc/resolv.conf') if l.startswith('nameserver')]
                  print('runner nameservers:', ns)
              except Exception as e:
                  print('could not read resolv.conf:', e)
              raise SystemExit(1)
          PY

      - name: Send weekly reports
        env:
          IN_TEST_EMAIL: ${{ inputs.test_email }}
          IN_CURRENT_WEEK: ${{ inputs.current_week }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$IN_TEST_EMAIL" ]; then export TEST_EMAIL_TO="$IN_TEST_EMAIL"; fi
          if [ "$IN_CURRENT_WEEK" = "true" ]; then export REPORT_WEEK=current; fi
          if [ "$IN_DRY_RUN" = "true" ]; then export DRY_RUN=1; fi
          python scripts/send_weekly_reports.py
